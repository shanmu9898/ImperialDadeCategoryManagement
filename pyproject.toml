[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imperial_dade"
version = "0.1.0"
description = "Imperial Dade category-agnostic substitution & optimization pipeline"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Imperial Dade Data Science"}]

dependencies = [
    # Data
    "pandas>=2.2",
    "polars>=1.0",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "xlsxwriter>=3.2",

    # LLM
    "openai>=1.40",
    "tiktoken>=0.7",
    "tenacity>=8.3",
    "nest-asyncio>=1.6",

    # Optimization
    "pulp>=2.9",

    # Matching
    "faiss-cpu>=1.8",
    "rapidfuzz>=3.9",      # drop-in for python-Levenshtein, more permissive license
    "python-Levenshtein>=0.25",
    "scikit-learn>=1.4",

    # Config & templating
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "python-dotenv>=1.0",

    # Data platform (Fornax — SQL Server via pyodbc, matching the legacy snippet)
    "pyodbc>=5.0",
    "sqlalchemy>=2.0",   # kept so pandas.read_sql stops emitting its non-SQLAlchemy warning

    # Microsoft Fabric lakehouse — pure-Python driver, Azure AD support
    "mssql-python>=1.6",

    # CLI & notebook
    "click>=8.1",
    "papermill>=2.6",
    "nbformat>=5.10",
    "ipykernel>=6.29",
    "tqdm>=4.66",
    # Note: jupyterlab / notebook UI are NOT required deps. Install them
    # separately for interactive editing — they currently fail to install
    # on Windows without long-path support enabled. See README.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
imperial-dade = "imperial_dade.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
imperial_dade = ["categories/*.yaml", "llm/prompts/*.j2"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: hits real Fornax / Azure OpenAI; skipped unless those creds are configured",
]
